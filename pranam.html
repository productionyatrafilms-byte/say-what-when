<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="pranam"></title>
        <link rel="stylesheet" href="./assets/fontawesome/css/fontawesome.min.css" />
    <link rel="stylesheet" href="./assets/fontawesome/css/solid.min.css" />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body style="background-color: #f1a832; height:100%; width:100% ">
    <a
      href="say-what-when.html"
      class="back-btn"
      style="
        position: fixed;
        top: 5%;
        left: 4%;
        width: 3vw;
        height: 3vw;
        z-index: 2;
        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
        border-radius: 50%;
        border: 0.2vw solid white;
      "
    >
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div
      class="language-container"
      style="
        position: fixed;
        top: 2.8vw;
        right: 4vw;
        display: flex;
        width: 8.4vw;
        padding: 0.2vw;
        height: auto;
        justify-content: space-between;
        align-items: center;
        border: 0.2vw solid white;
        border-radius: 50vw;
      "
    >
      <div
        class="english-button lang-active"
        style="
          width: 2.2vw;
          height: 2.2vw;
          font-size: 1.7vw;
          text-align: center;
          border: 0.2vw solid #ffffff;
          cursor: pointer;
          border-radius: 50%;
        "
      >
        E
      </div>
      <div
        class="hindi-button"
        style="
          width: 2.2vw;
          height: 2.2vw;
          font-size: 1.7vw;
          text-align: center;
          border: 0.2vw solid #ffffff;
          cursor: pointer;
          border-radius: 50%;
        "
      >
        H
      </div>
      <div
        class="gujrati-button"
        style="
          width: 2.2vw;
          height: 2.2vw;
          font-size: 1.7vw;
          text-align: center;
          border: 0.2vw solid #ffffff;
          cursor: pointer;
          border-radius: 50%;
        "
      >
        G
      </div>
    </div>
    <div
      class="pranam-container"
      style="
        position: absolute;
        width: 45vw;
        height: auto;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        justify-content: center;
        align-items: center;
      "
    >
      <div
        class="pranam-img"
        style="position: relative; width: 85%; height: auto; display: block"
      >
        <div
          class="pranam-video"
          style="
            position: absolute;
            left: 50%;
            top: 48.5%;
            background-image: url('assets/images/pranam-bg-1.png');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            transform: translate(-50%, -50%);
            width: 25.5vw;
            height: 28vw;
            border-radius: 50%;
            background-color: #f6f6f6;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding-right: 2.5vw;
          "
        >
          <video
            src="./assets/videos/pranam.mp4"
            autoplay
            muted
            style="width: 90%; height: 83%; object-fit: cover"
          ></video>
        </div>
        <span
          data-lang-key="pranam"
          style="
            z-index: 15;
            position: absolute;
            top: 0%;
            left: 50%;
            font-size: 3.4vw;
            transform: translateX(-50%);
            color: #821b00;
          "
        ></span>
        <img
          src="./assets/images/pranam-img.png"
          alt=""
          style="width: 100%; display: block"
        />
      </div>
      <a
        href="index.html"
        class="home-btn-1"
        style="position: absolute; top: 88%; left: 35%; width: 15vw; height: auto"
      >
        <span
          data-lang-key="home"
          style="
            z-index: 15;
            position: absolute;
            top: 45%;
            left: 38%;
            font-size: 2.5vw;
            transform: translateY(-50%);
            color: #821b00;
          "
        ></span>
        <img
          src="./assets/images/home-btn-1.png"
          alt=""
          style="width: 100%; display: block"
        />
      </a>
    </div>

    <script>
      // Play pranam.mp3 once, only on page load/refresh
      window.addEventListener("DOMContentLoaded", function () {
        const pranamAudio = new Audio("./assets/audio/pranam.mp3");
        pranamAudio.play().catch((err) => {
          console.warn("Pranam audio playback failed:", err);
        });
      });

      // Play pop.mp3 on back-btn and home-btn-1 clicks, then navigate
      function playPopAndNavigate(e, destination) {
        e.preventDefault();

        const popAudio = new Audio("./assets/audio/pop.mp3");
        popAudio.play().catch((err) => {
          console.warn("Pop audio playback failed:", err);
        });

        setTimeout(() => {
          window.location.href = destination;
        }, 1000);
      }

      const backBtn = document.querySelector(".back-btn");
      const homeBtn1 = document.querySelector(".home-btn-1");

      if (backBtn) {
        backBtn.addEventListener("click", function (e) {
          playPopAndNavigate(e, backBtn.getAttribute("href"));
        });
      }

      if (homeBtn1) {
        homeBtn1.addEventListener("click", function (e) {
          playPopAndNavigate(e, homeBtn1.getAttribute("href"));
        });
      }
    </script>
    <script src="./assets/js/data.js"></script>
    <script src="./assets/js/app.js"></script>
        <script src="assets/js/djp.js"></script>

  </body>
</html>
