<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="pranam"></title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body style="background-color: #f1a832; height:100%; width:100% ">
    <a href="say-what-when.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div class="language-container">
      <div class="english-button lang-active">E</div>
      <div class="hindi-button">H</div>
      <div class="gujrati-button">G</div>
    </div>
    <div class="pranam-container">
      <div class="pranam-img">
        <div class="pranam-video">
          <video src="./assets/videos/pranam.mp4" autoplay muted></video>
        </div>
        <span data-lang-key="pranam"></span>
        <img src="./assets/images/pranam-img.png" alt="" />
      </div>
      <a href="index.html" class="home-btn-1">
        <span data-lang-key="home"></span>
        <img src="./assets/images/home-btn-1.png" alt="" />
      </a>
    </div>

    <script>
      // Play pranam.mp3 once, only on page load/refresh
      window.addEventListener("DOMContentLoaded", function () {
        const pranamAudio = new Audio("./assets/audio/pranam.mp3");
        pranamAudio.play().catch((err) => {
          console.warn("Pranam audio playback failed:", err);
        });
      });

      // Play pop.mp3 on back-btn and home-btn-1 clicks, then navigate
      function playPopAndNavigate(e, destination) {
        e.preventDefault();

        const popAudio = new Audio("./assets/audio/pop.mp3");
        popAudio.play().catch((err) => {
          console.warn("Pop audio playback failed:", err);
        });

        setTimeout(() => {
          window.location.href = destination;
        }, 1000);
      }

      const backBtn = document.querySelector(".back-btn");
      const homeBtn1 = document.querySelector(".home-btn-1");

      if (backBtn) {
        backBtn.addEventListener("click", function (e) {
          playPopAndNavigate(e, backBtn.getAttribute("href"));
        });
      }

      if (homeBtn1) {
        homeBtn1.addEventListener("click", function (e) {
          playPopAndNavigate(e, homeBtn1.getAttribute("href"));
        });
      }
    </script>
    <script src="./assets/js/app.js"></script>
        <script src="assets/js/djp.js"></script>

  </body>
</html>
