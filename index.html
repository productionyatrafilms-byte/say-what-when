<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-lang-key="title">Document</title>
    <link rel="stylesheet" href="assets/css/style.css" />
    
    
  
  </head>
  <body>
    <div class="bg-image"></div>

    <!-- nav-container -->
    <div class="language-container">
      <div class="english-button lang-active">E</div>
      <div class="hindi-button">H</div>
      <div class="gujrati-button">G</div>
    </div>
    <!-- <a href="say-whan-when.html"> -->
    <button
      data-lang-key="title"
      class="title"
      onclick="playTitleSoundAndNavigate('say-what-when.html')"
    >
      Say What When
    </button>

    <!-- </a> -->
    <script>
      function playTitleSoundAndNavigate(url) {
        const titleAudio = new Audio("assets/audio/2.mp3");

        titleAudio.play().catch((err) => {
          console.warn("Title audio playback failed:", err);
        });

        // Wait 1 second so the audio has time to fully play before navigating away
        setTimeout(() => {
          window.location.href = url;
        }, 1000);
      }
    </script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/djp.js"></script>
  </body>
</html>
